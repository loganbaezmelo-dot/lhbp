<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logan's Homemade Bot-or-human Predictor (LHBP) v1.1</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: monospace; }
    body {
      background: #0f111a;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      margin: 0;
    }
    .box {
      background: #161b22;
      border: 2px dashed #30363d;
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #58a6ff; font-size: 1.4rem; margin-top: 0; }
    input[type="file"] { margin: 1rem 0; }
    #preview {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin: 1rem 0;
      display: none;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { background: #21262d; cursor: not-allowed; }
    #status { margin-top: 1rem; color: #8b949e; }
    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
      display: none;
    }
    .human { background: #23863633; color: #3fb950; border: 1px solid #238636; }
    .bot { background: #da363333; color: #f85149; border: 1px solid #da3633; }
    .log {
      margin-top: 1rem;
      text-align: left;
      font-size: 0.85rem;
      color: #8b949e;
      background: #0d1117;
      padding: 0.8rem;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>LHBP v1.1 🤖❌</h1>
    <p>Upload an image to verify real vs synthetic text via proxy dictionary</p>
    
    <input type="file" id="imageInput" accept="image/*" />
    <br />
    <img id="preview" alt="Preview" />
    <br />
    <button id="scanBtn" disabled>Run LHBP Analysis</button>

    <div id="status"></div>
    <div id="result"></div>
    <div id="log" class="log"></div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const scanBtn = document.getElementById('scanBtn');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const log = document.getElementById('log');

    let loadedFile = null;

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadedFile = file;
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'inline-block';
      scanBtn.disabled = false;
      result.style.display = 'none';
      log.style.display = 'none';
      status.innerText = "Ready to scan.";
    });

    scanBtn.addEventListener('click', async () => {
      if (!loadedFile) return;

      scanBtn.disabled = true;
      status.innerText = "Step 1: Reading text patterns with OCR...";
      result.style.display = 'none';
      log.style.display = 'none';

      try {
        const { data } = await Tesseract.recognize(loadedFile, 'eng', {
          logger: (m) => {
            if (m.status === 'recognizing text') {
              status.innerText = `OCR scanning... ${(m.progress * 100).toFixed(0)}%`;
            }
          }
        });

        const rawText = data.text || "";
        const cleanTokens = rawText
          .toLowerCase()
          .replace(/[^a-z\s]/g, ' ')
          .split(/\s+/)
          .filter(w => w.length > 2);

        if (cleanTokens.length === 0) {
          result.className = "bot";
          result.innerText = "⚠️ Inconclusive / No readable text found";
          result.style.display = 'block';
          status.innerText = "Scan finished.";
          scanBtn.disabled = false;
          return;
        }

        status.innerText = "Step 2: Checking words against dictionary proxy...";

        // send tokens to proxy.js
        const res = await fetch('/api/proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ words: cleanTokens })
        });

        if (!res.ok) throw new Error("Proxy error: " + res.statusText);

        const dataProxy = await res.json();
        const totalChecked = dataProxy.totalChecked;
        const realCount = dataProxy.realWordCount;
        const ratio = totalChecked > 0 ? (realCount / totalChecked) : 0;

        log.style.display = 'block';
        log.innerText = `Extracted Text Sample:\n"${rawText.slice(0, 180)}..."\n\nVerified Words (${realCount}/${totalChecked}):\n` + 
          JSON.stringify(dataProxy.validWords) + 
          `\n\nRejected / Gibberish Words:\n` + 
          JSON.stringify(dataProxy.fakeWords);

        // verdict logic: if there are multiple confirmed real english words, it's human
        if (realCount >= 4 || ratio >= 0.40) {
          result.className = "human";
          result.innerText = "✅ LIKELY HUMAN (Real dictionary words verified)";
        } else if (totalChecked >= 3 && ratio < 0.20) {
          result.className = "bot";
          result.innerText = "🚨 LIKELY AI BOT (High gibberish ratio)";
        } else {
          result.className = "bot";
          result.innerText = "⚠️ SUSPECTED AI / UNCERTAIN";
        }

        result.style.display = 'block';
        status.innerText = `Accuracy check: ${(ratio * 100).toFixed(0)}% dictionary match (${realCount} real words found).`;

      } catch (err) {
        status.innerText = "Error running scan or proxy failed 💀";
        console.error(err);
      } finally {
        scanBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
