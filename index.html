<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logan's Homemade Bot-or-human Predictor (LHBP)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: monospace; }
    body {
      background: #0f111a;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      margin: 0;
    }
    .box {
      background: #161b22;
      border: 2px dashed #30363d;
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #58a6ff; font-size: 1.4rem; margin-top: 0; }
    input[type="file"] { margin: 1rem 0; }
    #preview {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin: 1rem 0;
      display: none;
    }
    button {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { background: #21262d; cursor: not-allowed; opacity: 0.6; }
    #status { margin-top: 1rem; color: #8b949e; }
    #result {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
      display: none;
    }
    .human { background: #23863633; color: #3fb950; border: 1px solid #238636; }
    .bot { background: #da363333; color: #f85149; border: 1px solid #da3633; }
    .log {
      margin-top: 1rem;
      text-align: left;
      font-size: 0.85rem;
      color: #8b949e;
      background: #0d1117;
      padding: 0.8rem;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>LHBP v1.4 🤖❌</h1>
    <p>Zero-Backend OCR & RAM Dictionary Engine</p>
    
    <input type="file" id="imageInput" accept="image/*" />
    <br />
    <img id="preview" alt="Preview" />
    <br />
    <button id="scanBtn" disabled>Run LHBP Analysis</button>

    <div id="status">Loading dictionary database...</div>
    <div id="result"></div>
    <div id="log" class="log"></div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const scanBtn = document.getElementById('scanBtn');
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const log = document.getElementById('log');

    // starter pack so it works even if offline/cdn drops
    const fallbackWords = [
      "the","and","for","are","with","which","this","that","have","not","but","they","from","what",
      "video","game","console","preorders","selling","minutes","across","online","sites","retail",
      "generated","mistakes","youtube","home","search","images","notifications","activity","updates",
      "team","follow","legend","zelda","edition","special","system","celebration","hardware","spark",
      "frustration","fans","struggling","secure","chicken","sandwich","pizza","wednesday","thursday",
      "friday","monday","tuesday","tacos","nachos","cheeseburger","uncrustable","player"
    ];

    let dictionarySet = new Set(fallbackWords);
    let dictReady = false;
    let loadedFile = null;

    async function loadDictionary() {
      try {
        const res = await fetch('https://raw.githubusercontent.com/words/an-array-of-english-words/master/words.json');
        if (!res.ok) throw new Error('CDN response not ok');
        const words = await res.json();
        words.forEach(w => dictionarySet.add(w.toLowerCase()));
        
        fallbackWords.forEach(w => dictionarySet.add(w));
        dictReady = true;
        status.innerText = `Ready! (${dictionarySet.size.toLocaleString()} words loaded in RAM).`;
      } catch (e) {
        console.warn("External wordlist failed, using built-in set:", e);
        dictReady = true;
        status.innerText = `Ready (Offline core loaded: ${dictionarySet.size} words).`;
      }
      checkReadyState();
    }
    loadDictionary();

    function checkReadyState() {
      if (loadedFile && dictReady) {
        scanBtn.disabled = false;
      }
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadedFile = file;
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'inline-block';
      result.style.display = 'none';
      log.style.display = 'none';
      checkReadyState();
    });

    scanBtn.addEventListener('click', async () => {
      if (!loadedFile || !dictReady) return;

      scanBtn.disabled = true;
      status.innerText = "Step 1: Reading text with OCR...";
      result.style.display = 'none';
      log.style.display = 'none';

      try {
        const { data } = await Tesseract.recognize(loadedFile, 'eng', {
          logger: (m) => {
            if (m.status === 'recognizing text') {
              status.innerText = `OCR scanning... ${(m.progress * 100).toFixed(0)}%`;
            }
          }
        });

        const rawText = data.text || "";
        const cleanTokens = [...new Set(
          rawText
            .toLowerCase()
            .replace(/[^a-z\s]/g, ' ')
            .split(/\s+/)
            .filter(w => w.length > 2)
        )];

        if (cleanTokens.length === 0) {
          result.className = "bot";
          result.innerText = "⚠️ Inconclusive / No readable text found";
          result.style.display = 'block';
          status.innerText = "Scan finished.";
          scanBtn.disabled = false;
          return;
        }

        status.innerText = "Step 2: Cross-referencing dictionary in RAM...";

        const validWords = [];
        const fakeWords = [];

        cleanTokens.forEach(word => {
          if (dictionarySet.has(word)) {
            validWords.push(word);
          } else {
            fakeWords.push(word);
          }
        });

        const totalChecked = cleanTokens.length;
        const realCount = validWords.length;
        const ratio = totalChecked > 0 ? (realCount / totalChecked) : 0;

        log.style.display = 'block';
        log.innerText = `Extracted Text Sample:\n"${rawText.slice(0, 180)}..."\n\nVerified Real Words (${realCount}/${totalChecked}):\n` + 
          JSON.stringify(validWords) + 
          `\n\nRejected / Gibberish Words:\n` + 
          JSON.stringify(fakeWords);

        if (realCount >= 4 || ratio >= 0.30) {
          result.className = "human";
          result.innerText = "✅ LIKELY HUMAN (Real text verified)";
        } else if (totalChecked >= 3 && ratio < 0.20) {
          result.className = "bot";
          result.innerText = "🚨 LIKELY AI BOT (High gibberish ratio)";
        } else {
          result.className = "bot";
          result.innerText = "⚠️ SUSPECTED AI / INCONCLUSIVE";
        }

        result.style.display = 'block';
        status.innerText = `Scan complete: ${(ratio * 100).toFixed(0)}% match (${realCount} real words).`;

      } catch (err) {
        status.innerText = "Error running LHBP scan 💀";
        console.error(err);
      } finally {
        scanBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
